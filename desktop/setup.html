<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
    <title>Set up this till</title>
    <style>
      :root {
        --bg: #ffffff; --fg: #111827; --muted: #6b7280; --line: #d1d5db;
        --accent: #111827; --accent-fg: #ffffff; --error: #b91c1c; --ok: #047857; --field: #f9fafb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111318; --fg: #f3f4f6; --muted: #9ca3af; --line: #374151;
          --accent: #f3f4f6; --accent-fg: #111318; --error: #f87171; --ok: #34d399; --field: #1a1d24;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg); color: var(--fg);
        font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
        display: grid; place-items: center; padding: 24px;
      }
      form { width: 100%; max-width: 400px; display: grid; gap: 18px; }
      h1 { margin: 0; font-size: 1.45rem; font-weight: 600; }
      p { margin: 0; color: var(--muted); }
      label { display: grid; gap: 6px; font-weight: 600; font-size: 0.9rem; }
      input {
        font: inherit; color: var(--fg); background: var(--field);
        border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%;
      }
      input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .hint { font-weight: 400; color: var(--muted); font-size: 0.85rem; }
      .owner { display: grid; gap: 14px; padding-top: 4px; border-top: 1px solid var(--line); }
      .owner[hidden] { display: none; }
      .row { display: flex; gap: 10px; justify-content: flex-end; }
      button {
        font: inherit; font-weight: 600; border-radius: 8px; padding: 10px 18px; cursor: pointer;
        border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg);
      }
      button.quiet { background: transparent; color: var(--fg); border-color: var(--line); }
      button:disabled { opacity: 0.55; cursor: default; }
      .msg { min-height: 1.5em; font-size: 0.9rem; }
      .msg.error { color: var(--error); }
      .msg.ok { color: var(--ok); }
    </style>
  </head>
  <body>
    <form id="form" novalidate>
      <div>
        <h1 id="title">Set up this till</h1>
        <p id="lede">Enter the business this till sells for. Staff and owners then sign in to it.</p>
      </div>

      <label for="code">
        Business code
        <input id="code" name="code" autocomplete="off" spellcheck="false" placeholder="belkis" autofocus />
        <span class="hint">The first part of your Sellix web address: belkis.sellix… → belkis</span>
      </label>

      <div class="owner" id="owner" hidden>
        <p>An owner of the new business signs in to approve the change.</p>
        <label for="email">
          Owner email
          <input id="email" name="email" type="email" autocomplete="off" />
        </label>
        <label for="password">
          Owner password
          <input id="password" name="password" type="password" autocomplete="off" />
        </label>
      </div>

      <div class="msg" id="msg" role="status" aria-live="polite"></div>

      <div class="row">
        <button type="button" class="quiet" id="cancel" hidden>Cancel</button>
        <button type="submit" id="submit">Continue</button>
      </div>
    </form>
    <script src="setup.js"></script>
  </body>
</html>
